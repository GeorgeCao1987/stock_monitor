name: extreme-running-lock-walkforward-v37

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data/extreme_running_lock_walkforward_v37.py'
      - 'market_data/extreme_running_lock_walkforward_v37_cloud.py'
      - '.github/workflows/extreme-running-lock-walkforward-v37.yml'

permissions:
  contents: read
  actions: read

jobs:
  running-lock-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MARKET_START_DATE: '2024-09-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2
      - name: Collect exact 5m history and run V3.7 corrected lock walk-forward
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python extreme_running_lock_walkforward_v37_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: extreme-running-lock-walkforward-v37-${{ github.run_id }}
          path: market_data/results/
