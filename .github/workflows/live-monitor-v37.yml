name: live-monitor-v37

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data/live_monitor_v37.py'
      - '.github/workflows/live-monitor-v37.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: live-monitor-v37-manual
  cancel-in-progress: false

jobs:
  smoke-test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: python -m py_compile market_data/live_monitor_v37.py market_data/live_tick_v37.py market_data/asof_replay_v37.py market_data/feishu_notifier.py market_data/prepare_live_model_v37.py

  realtime-monitor:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MARKET_START_DATE: '2024-09-01'
      LIVE_SYMBOL: '002916'
      LIVE_PUSH_DELTA: '0.15'
      LIVE_BAR_SETTLE_SECONDS: '25'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2 joblib
      - name: Check trading day and resolve cache key
        id: market_day
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import pandas as pd
          import exchange_calendars as xcals
          today = datetime.now(ZoneInfo('Asia/Shanghai')).date()
          cal = xcals.get_calendar('XSHG')
          is_trading = bool(cal.is_session(pd.Timestamp(today)))
          train_end = today - timedelta(days=1)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"is_trading={'true' if is_trading else 'false'}\n")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'MARKET_END_DATE={train_end.isoformat()}\n')
              f.write(f'LIVE_CACHE_KEY=live-v37-{train_end.isoformat()}\n')
          PY
      - name: Restore live cache
        if: steps.market_day.outputs.is_trading == 'true'
        id: live_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            market_data/data
            market_data/results/completeness.csv
            market_data/live_cache
          key: ${{ env.LIVE_CACHE_KEY }}
      - name: Run manual long monitor
        if: steps.market_day.outputs.is_trading == 'true' && steps.live_cache.outputs.cache-hit == 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python market_data/live_monitor_v37.py
