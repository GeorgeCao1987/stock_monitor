name: live-prepare-v37

on:
  schedule:
    - cron: '30 23 * * 1-5'  # 07:30 China time
    - cron: '0 0 * * 1-5'    # 08:00
    - cron: '30 0 * * 1-5'   # 08:30
  workflow_dispatch:
  push:
    paths:
      - 'market_data/prepare_live_model_v37.py'
      - 'market_data/live_prepare_trigger.txt'
      - '.github/workflows/live-prepare-v37.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: live-prepare-v37
  cancel-in-progress: true

jobs:
  prepare:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[live-prepare]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MARKET_START_DATE: '2024-09-01'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2 joblib
      - name: Resolve training cutoff and cache key
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          today = datetime.now(ZoneInfo('Asia/Shanghai')).date()
          train_end = today - timedelta(days=1)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'MARKET_END_DATE={train_end.isoformat()}\n')
              f.write(f'LIVE_CACHE_KEY=live-v37-{train_end.isoformat()}\n')
          PY
      - name: Collect training history
        working-directory: market_data
        run: |
          rm -rf data results live_cache && mkdir -p data results live_cache
          python oos_core_collect.py
          python prepare_live_model_v37.py
      - name: Save live cache
        uses: actions/cache/save@v4
        with:
          path: |
            market_data/data
            market_data/results/completeness.csv
            market_data/live_cache
          key: ${{ env.LIVE_CACHE_KEY }}
