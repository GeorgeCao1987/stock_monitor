name: extreme-pattern-top-v32-holdout

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data/extreme_pattern_top_v32_holdout.py'
      - 'market_data/extreme_pattern_top_v32_holdout_cloud.py'
      - '.github/workflows/extreme-pattern-top-v32-holdout.yml'

permissions:
  contents: read
  actions: read

jobs:
  untouched-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MARKET_START_DATE: '2025-02-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2
      - name: Collect exact history and evaluate frozen V3.2 on untouched Mar-Apr 2025
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python extreme_pattern_top_v32_holdout_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: extreme-pattern-top-v32-holdout-${{ github.run_id }}
          path: market_data/results/
