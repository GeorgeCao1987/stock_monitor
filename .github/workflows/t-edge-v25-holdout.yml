name: t-edge-v25-holdout

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data/t_edge_v25.py'
      - 'market_data/t_edge_v25_cloud.py'
      - '.github/workflows/t-edge-v25-holdout.yml'

permissions:
  contents: read
  actions: read

jobs:
  jul-aug-2025-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARKET_START_DATE: '2025-07-01'
      MARKET_END_DATE: '2025-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect untouched holdout and evaluate frozen V2.5 rule
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python t_edge_v25_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: t-edge-v25-jul-aug-holdout-${{ github.run_id }}
          path: market_data/results/
