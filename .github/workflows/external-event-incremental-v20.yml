name: external-event-incremental-v20

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        period:
          - { name: jan-feb, start: '2026-01-01', end: '2026-02-28' }
          - { name: mar-apr, start: '2026-03-01', end: '2026-04-30' }
          - { name: may-jun, start: '2026-05-01', end: '2026-06-30' }
          - { name: jul-aug, start: '2026-07-01', end: '2026-08-31' }
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      MARKET_START_DATE: ${{ matrix.period.start }}
      MARKET_END_DATE: ${{ matrix.period.end }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect core data and external realtime-message history
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python news_collector.py
          python external_event_incremental_v20_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: external-event-v20-${{ matrix.period.name }}-${{ github.run_id }}
          path: |
            market_data/results/
            market_data/data/news_events.csv
