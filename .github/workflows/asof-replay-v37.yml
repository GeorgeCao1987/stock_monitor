name: asof-replay-v37

on:
  push:
    branches: [main]
    paths:
      - 'market_data/asof_replay_request.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  replay-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MARKET_START_DATE: '2024-09-01'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2

      - name: Load replay request
        run: |
          python - <<'PY'
          import json, os
          from datetime import date, timedelta
          with open('market_data/asof_replay_request.json', encoding='utf-8') as f:
              req = json.load(f)
          target = date.fromisoformat(req['日期'])
          train_end = target - timedelta(days=1)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"ASOF_SYMBOL={req['证券代码']}\n")
              f.write(f"ASOF_DATE={req['日期']}\n")
              f.write(f"ASOF_TIME={req['时间']}\n")
              f.write(f"MARKET_END_DATE={train_end.isoformat()}\n")
          PY

      - name: Collect training history through prior day only
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py

      - name: Strict as-of V3.7 score
        run: python market_data/asof_replay_v37.py

      - name: Push compact Feishu card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_CARD_FILE: market_data/results/asof_replay_card.json
        run: python market_data/feishu_notifier.py

      - name: Upload replay audit
        uses: actions/upload-artifact@v4
        with:
          name: asof-replay-v37-${{ github.run_id }}
          path: |
            market_data/results/asof_replay_v37.json
            market_data/results/asof_replay_card.json
            market_data/results/completeness.csv
