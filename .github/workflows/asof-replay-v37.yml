name: asof-replay-v37

on:
  push:
    branches: [main]
    paths:
      - 'market_data/asof_replay_request.json'
  workflow_dispatch:

jobs:
  replay-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r market_data/requirements.txt pytdx scikit-learn

      - name: Load replay request
        run: |
          python - <<'PY'
          import json, os
          with open('market_data/asof_replay_request.json', encoding='utf-8') as f:
              req = json.load(f)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"ASOF_SYMBOL={req['证券代码']}\n")
              f.write(f"ASOF_DATE={req['日期']}\n")
              f.write(f"ASOF_TIME={req['时间']}\n")
          PY

      - name: Strict as-of replay
        run: python market_data/asof_replay_v37.py

      - name: Push compact Feishu card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_CARD_FILE: market_data/results/asof_replay_card.json
        run: python market_data/feishu_notifier.py

      - name: Upload replay audit
        uses: actions/upload-artifact@v4
        with:
          name: asof-replay-v37-${{ github.run_id }}
          path: |
            market_data/results/asof_replay_v37.json
            market_data/results/asof_replay_card.json
