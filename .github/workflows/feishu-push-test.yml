name: feishu-push-test

on:
  push:
    branches: [main]
    paths:
      - 'market_data/feishu_test_card.json'
      - 'market_data/feishu_notifier.py'
      - '.github/workflows/feishu-push-test.yml'
  workflow_dispatch:

jobs:
  push-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Feishu card
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_CARD_FILE: market_data/feishu_test_card.json
        run: python market_data/feishu_notifier.py
