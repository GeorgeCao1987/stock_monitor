name: WolfBot NGA Knowledge Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wolfbot-nga-sync.yml"

permissions:
  contents: write

concurrency:
  group: wolfbot-nga-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout wolfbot branch
        uses: actions/checkout@v4
        with:
          ref: wolfbot
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: wolfbot/requirements.txt

      - name: Install sync dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dotenv jieba openai

      - name: Check NGA credential
        id: credential
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
        run: |
          if [ -z "$NGA_COOKIE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NGA_COOKIE is not configured. Add it under Settings > Secrets and variables > Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive immutable author-only sources
        if: steps.credential.outputs.configured == 'true'
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
          NGA_UID: "150058"
          NGA_TID: "47288722"
          NGA_ARCHIVE_MAX_PAGES: "5000"
          NGA_ARCHIVE_SLEEP: "0.8"
        run: python wolfbot/nga_author_archive.py

      - name: Patch NGA API envelope compatibility
        if: steps.credential.outputs.configured == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('wolfbot/crawler.py')
          s=p.read_text(encoding='utf-8')
          needle='''        if not isinstance(data, dict):\n            return [], False\n\n        serialized = json.dumps(data, ensure_ascii=False)\n'''
          repl='''        if not isinstance(data, dict):\n            return [], False\n        # Newer NGA JSON wraps __R/__T/__PAGE under top-level data.\n        if isinstance(data.get("data"), dict):\n            data = data["data"]\n\n        serialized = json.dumps(data, ensure_ascii=False)\n'''
          if needle not in s:
              raise SystemExit('crawler envelope patch target not found')
          p.write_text(s.replace(needle,repl,1),encoding='utf-8')
          PY

      - name: Crawl and build rule candidates
        if: steps.credential.outputs.configured == 'true'
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
          NGA_UID: "150058"
          NGA_TID: "47288722"
          NGA_SYNC_SLEEP: "0.8"
          NGA_SYNC_MAX_PAGES: "5000"
          NGA_BOOTSTRAP_MAX_PAGES: "5000"
          RULE_LLM_API_KEY: ${{ secrets.RULE_LLM_API_KEY }}
          RULE_LLM_BASE_URL: ${{ secrets.RULE_LLM_BASE_URL }}
          RULE_LLM_MODEL: ${{ secrets.RULE_LLM_MODEL }}
        run: python wolfbot/sync_pipeline.py

      - name: Build derived semantic review digest
        if: steps.credential.outputs.configured == 'true'
        run: python wolfbot/build_review_digest.py

      - name: Commit knowledge delta to wolfbot branch
        if: steps.credential.outputs.configured == 'true'
        run: |
          git config user.name "wolfbot-cloud-sync"
          git config user.email "wolfbot-cloud-sync@users.noreply.github.com"
          git add wolfbot/knowledge
          if git diff --cached --quiet; then
            echo "No new NGA knowledge."
            exit 0
          fi
          git commit -m "wolfbot: sync NGA knowledge $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push origin HEAD:wolfbot
