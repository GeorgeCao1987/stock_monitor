name: WolfBot NGA Knowledge Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wolfbot-nga-sync.yml"

permissions:
  contents: write

concurrency:
  group: wolfbot-nga-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout wolfbot branch
        uses: actions/checkout@v4
        with:
          ref: wolfbot
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: wolfbot/requirements.txt

      - name: Install sync dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dotenv jieba openai

      - name: Check NGA credential
        id: credential
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
        run: |
          if [ -z "$NGA_COOKIE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NGA_COOKIE is not configured. Add it under Settings > Secrets and variables > Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Diagnose author-only page
        if: steps.credential.outputs.configured == 'true'
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, requests
          from bs4 import BeautifulSoup
          s=requests.Session()
          s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          raw=os.environ.get('NGA_COOKIE','').strip()
          for part in raw.split(';'):
              if '=' in part:
                  k,v=part.split('=',1); s.cookies.set(k.strip(),v.strip())
          p={'tid':'47288722','authorid':'150058','page':'1','__output':'11'}
          r=s.get('https://bbs.nga.cn/read.php',params=p,timeout=20)
          t=r.text
          start,end=t.find('{'),t.rfind('}')
          data=json.loads(t[start:end+1], strict=False) if start>=0 and end>start else {}
          print({'status':r.status_code,'len':len(t),'sha256':hashlib.sha256(r.content).hexdigest(),'top_keys':sorted(data.keys()),'R_type':type(data.get('__R')).__name__,'T_type':type(data.get('__T')).__name__,'PAGE':data.get('__PAGE')})
          R=data.get('__R')
          if isinstance(R,dict): print({'R_count':len(R),'R_keys_head':list(R.keys())[:5]})
          elif isinstance(R,list): print({'R_count':len(R)})
          T=data.get('__T')
          if isinstance(T,dict): print({'T_keys':sorted(T.keys())})
          found=[]
          def walk(x,path='root'):
              if isinstance(x,dict):
                  aid=x.get('authorid')
                  if str(aid)=='150058':
                      found.append({'path':path,'keys':sorted(x.keys()),'pid':x.get('pid'),'lou':x.get('lou'),'postdate':x.get('postdate'),'content_len':len(str(x.get('content','')))})
                  for k,v in x.items(): walk(v,f'{path}.{k}')
              elif isinstance(x,list):
                  for i,v in enumerate(x): walk(v,f'{path}[{i}]')
          walk(data)
          print({'author_rows_found':len(found),'author_rows_head':found[:3]})
          PY

      - name: Crawl and build rule candidates
        if: steps.credential.outputs.configured == 'true'
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
          NGA_UID: "150058"
          NGA_TID: "47288722"
          NGA_SYNC_SLEEP: "1.0"
          NGA_SYNC_MAX_PAGES: "5000"
          NGA_BOOTSTRAP_MAX_PAGES: "5000"
          RULE_LLM_API_KEY: ${{ secrets.RULE_LLM_API_KEY }}
          RULE_LLM_BASE_URL: ${{ secrets.RULE_LLM_BASE_URL }}
          RULE_LLM_MODEL: ${{ secrets.RULE_LLM_MODEL }}
        run: python wolfbot/sync_pipeline.py

      - name: Commit knowledge delta to wolfbot branch
        if: steps.credential.outputs.configured == 'true'
        run: |
          git config user.name "wolfbot-cloud-sync"
          git config user.email "wolfbot-cloud-sync@users.noreply.github.com"
          git add wolfbot/knowledge
          if git diff --cached --quiet; then
            echo "No new NGA knowledge."
            exit 0
          fi
          git commit -m "wolfbot: sync NGA knowledge $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push origin HEAD:wolfbot
