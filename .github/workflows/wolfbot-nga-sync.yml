# trigger: cloud-endpoint-fallback-v2
name: WolfBot NGA Knowledge Sync

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wolfbot-nga-sync.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: wolfbot-nga-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout wolfbot branch
        uses: actions/checkout@v4
        with:
          ref: wolfbot
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: wolfbot/requirements.txt

      - name: Install sync dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml python-dotenv jieba openai

      - name: Check NGA credential
        id: credential
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
        run: |
          if [ -z "$NGA_COOKIE" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NGA_COOKIE is not configured. Add it under Settings > Secrets and variables > Actions."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crawl and build rule candidates
        if: steps.credential.outputs.configured == 'true'
        env:
          NGA_COOKIE: ${{ secrets.NGA_COOKIE }}
          NGA_UID: "150058"
          NGA_TID: "45974302"
          NGA_SYNC_SLEEP: "1.0"
          NGA_SYNC_MAX_PAGES: "12"
          NGA_BOOTSTRAP_MAX_PAGES: "5000"
          RULE_LLM_API_KEY: ${{ secrets.RULE_LLM_API_KEY }}
          RULE_LLM_BASE_URL: ${{ secrets.RULE_LLM_BASE_URL }}
          RULE_LLM_MODEL: ${{ secrets.RULE_LLM_MODEL }}
        run: python wolfbot/sync_pipeline.py

      - name: Commit knowledge delta to wolfbot branch
        if: steps.credential.outputs.configured == 'true'
        run: |
          git config user.name "wolfbot-cloud-sync"
          git config user.email "wolfbot-cloud-sync@users.noreply.github.com"
          git add wolfbot/knowledge
          if git diff --cached --quiet; then
            echo "No new NGA knowledge."
            exit 0
          fi
          git commit -m "wolfbot: sync NGA knowledge $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push origin HEAD:wolfbot
