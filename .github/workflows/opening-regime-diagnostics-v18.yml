name: opening-regime-diagnostics-v18

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jan-feb:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MARKET_START_DATE: '2026-01-01'
      MARKET_END_DATE: '2026-02-28'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect exact core and run opening diagnostics
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python opening_regime_diagnostics_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: opening-v18-jan-feb-${{ github.run_id }}
          path: market_data/results/

  mar-apr:
