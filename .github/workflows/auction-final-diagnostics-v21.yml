name: auction-final-diagnostics-v21

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data/AUCTION_V21_TRIGGER'

permissions:
  contents: read
  actions: read

jobs:
  dev-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MARKET_START_DATE: '2026-01-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect exact 5m core and run 09:25 final-auction diagnostics
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python auction_final_diagnostics_v21.py
      - uses: actions/upload-artifact@v4
        with:
          name: auction-final-v21-${{ github.run_id }}
          path: market_data/results/
