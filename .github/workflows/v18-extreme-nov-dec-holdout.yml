name: v18-extreme-nov-dec-holdout

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  holdout-nov-dec-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKET_START_DATE: '2025-11-01'
      MARKET_END_DATE: '2025-12-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect untouched holdout and run frozen V1.8
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python v18_extreme_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: v18-extreme-nov-dec-holdout-${{ github.run_id }}
          path: market_data/results/
