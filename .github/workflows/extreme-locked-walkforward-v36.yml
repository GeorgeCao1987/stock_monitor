name: extreme-locked-walkforward-v36

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data/extreme_locked_walkforward_v36.py'
      - 'market_data/extreme_locked_walkforward_v36_cloud.py'
      - 'market_data/oos_core_collect.py'
      - '.github/workflows/extreme-locked-walkforward-v36.yml'

permissions:
  contents: read
  actions: read

jobs:
  bull-regime-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MARKET_START_DATE: '2024-08-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2
      - name: Collect exact 5m history and run V3.6 chronological walk-forward
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python extreme_locked_walkforward_v36_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: extreme-locked-walkforward-v36-${{ github.run_id }}
          path: market_data/results/
