name: Migrate stock model from microservice

on:
  push:
    paths:
      - '.github/workflows/migrate-from-microservice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source branch
        run: |
          git clone --depth 1 --branch market-data-v13 https://github.com/GeorgeCao1987/microservice.git /tmp/source

      - name: Copy stock model code and strategy
        run: |
          rm -rf market_data
          cp -a /tmp/source/market_data ./market_data
          cp /tmp/source/STRATEGY.md ./STRATEGY.md

      - name: Commit migrated model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data STRATEGY.md
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "chore: migrate intraday stock model from microservice"
          git push origin HEAD:main
