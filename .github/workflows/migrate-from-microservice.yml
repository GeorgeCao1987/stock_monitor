name: Archive source stock workflows

on:
  push:
    paths:
      - '.github/workflows/migrate-from-microservice.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source branch
        run: |
          git clone --depth 1 --branch market-data-v13 https://github.com/GeorgeCao1987/microservice.git /tmp/source

      - name: Archive source workflows
        run: |
          rm -rf workflow_archive
          mkdir -p workflow_archive
          cp /tmp/source/.github/workflows/*.yml ./workflow_archive/

      - name: Commit workflow archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workflow_archive
          if git diff --cached --quiet; then
            echo "No archive changes"
            exit 0
          fi
          git commit -m "chore: archive migrated stock model workflows"
          git push origin HEAD:main
