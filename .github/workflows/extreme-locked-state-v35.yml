name: extreme-locked-state-v35

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data/extreme_locked_state_v35.py'
      - 'market_data/extreme_locked_state_v35_cloud.py'
      - '.github/workflows/extreme-locked-state-v35.yml'

permissions:
  contents: read
  actions: read

jobs:
  daily-latched-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      MARKET_START_DATE: '2024-12-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2
      - name: Collect exact history and run V3.5 daily-latched holdout
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python extreme_locked_state_v35_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: extreme-locked-state-v35-${{ github.run_id }}
          path: market_data/results/
