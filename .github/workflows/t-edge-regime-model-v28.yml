name: t-edge-regime-model-v28

on:
  workflow_dispatch:
  push:
    paths:
      - 'market_data/t_edge_regime_model_v28.py'
      - 'market_data/t_edge_regime_model_v28_cloud.py'
      - '.github/workflows/t-edge-regime-model-v28.yml'

permissions:
  contents: read
  actions: read

jobs:
  broad-oof:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      MARKET_START_DATE: '2025-05-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2
      - name: Collect all consumed regimes and run V2.8 eight-period OOF
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python t_edge_regime_model_v28_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: t-edge-regime-model-v28-${{ github.run_id }}
          path: market_data/results/
