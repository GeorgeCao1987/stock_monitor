name: t-edge-state-machine-v27-holdout

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/t-edge-state-machine-v27-holdout.yml'

permissions:
  contents: read
  actions: read

jobs:
  may-jun-2025-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      MARKET_START_DATE: '2025-05-01'
      MARKET_END_DATE: '2025-06-30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect untouched data and evaluate frozen V2.7
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python - <<'PY'
          import backtest_v13 as v13
          from backtest_v14_cloud import load_a_cloud
          import t_edge_state_machine_v27_holdout as h
          v13.load_a = load_a_cloud
          h.main()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: t-edge-state-machine-v27-may-jun-holdout-${{ github.run_id }}
          path: market_data/results/
