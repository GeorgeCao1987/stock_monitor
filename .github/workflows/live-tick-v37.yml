name: live-tick-v37

on:
  schedule:
    # Trigger about one minute after each five-minute bar close (UTC cron).
    - cron: '1-56/5 1-7 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'market_data/live_tick_v37.py'
      - '.github/workflows/live-tick-v37.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: live-tick-v37
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_START_DATE: '2024-09-01'
      LIVE_SYMBOL: '002916'
      LIVE_BAR_SETTLE_SECONDS: '25'
      LIVE_MAX_COMMON_LAG_MINUTES: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r market_data/requirements.txt
          pip install pytdx scikit-learn==1.7.2 joblib

      - name: Resolve trading window and cache keys
        id: gate
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import pandas as pd
          import exchange_calendars as xcals

          tz = ZoneInfo('Asia/Shanghai')
          now = datetime.now(tz)
          cal = xcals.get_calendar('XSHG')
          today = pd.Timestamp(now.date())
          is_trading = bool(cal.is_session(today))
          hhmm = now.strftime('%H:%M')
          in_window = ('09:30' <= hhmm <= '11:35') or ('13:00' <= hhmm <= '15:10')
          should_run = is_trading and in_window

          # Model/cache cutoff is the previous actual XSHG trading session, not yesterday's calendar date.
          prev_session = cal.previous_session(today) if is_trading else cal.date_to_session(today, direction='previous')
          train_end = prev_session.date()

          # Jobs fire roughly one minute after a bar close; floor to the corresponding 5m bar.
          minute = (now.minute // 5) * 5
          bucket = now.replace(minute=minute, second=0, microsecond=0)
          tick_key = bucket.strftime('%Y%m%d-%H%M')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"should_run={'true' if should_run else 'false'}\n")
              f.write(f"tick_key={tick_key}\n")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'MARKET_END_DATE={train_end.isoformat()}\n')
              f.write(f'LIVE_CACHE_KEY=live-v37-{train_end.isoformat()}\n')
              f.write(f'TICK_MARKER_KEY=live-tick-sent-{tick_key}\n')
          print('NOW', now.isoformat(), 'TRADING', is_trading, 'WINDOW', in_window,
                'TRAIN_END', train_end, 'TICK_KEY', tick_key)
          PY

      - name: Restore live model cache
        if: steps.gate.outputs.should_run == 'true'
        id: live_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            market_data/data
            market_data/results/completeness.csv
            market_data/live_cache
          key: ${{ env.LIVE_CACHE_KEY }}

      - name: Restore sent marker
        if: steps.gate.outputs.should_run == 'true'
        id: sent
        uses: actions/cache/restore@v4
        with:
          path: market_data/results/tick_sent.marker
          key: ${{ env.TICK_MARKER_KEY }}

      - name: Fail if model cache is missing
        if: steps.gate.outputs.should_run == 'true' && steps.live_cache.outputs.cache-hit != 'true'
        run: |
          echo 'LIVE_MODEL_CACHE_MISSING'
          exit 2

      - name: Score latest completed bar and push Feishu
        if: steps.gate.outputs.should_run == 'true' && steps.sent.outputs.cache-hit != 'true'
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: python market_data/live_tick_v37.py

      - name: Save sent marker
        if: steps.gate.outputs.should_run == 'true' && steps.sent.outputs.cache-hit != 'true' && success()
        run: |
          mkdir -p market_data/results
          echo "${TICK_MARKER_KEY}" > market_data/results/tick_sent.marker

      - name: Cache sent marker
        if: steps.gate.outputs.should_run == 'true' && steps.sent.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: market_data/results/tick_sent.marker
          key: ${{ env.TICK_MARKER_KEY }}
