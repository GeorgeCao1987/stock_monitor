name: v17-nov-dec-holdout

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - 'market_data/event_engine_v17.py'
      - 'market_data/event_engine_v17_cloud.py'
      - '.github/workflows/v17-nov-dec-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKET_START_DATE: '2025-11-01'
      MARKET_END_DATE: '2025-12-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect exact untouched core holdout
        working-directory: market_data
        run: |
          rm -rf data results
          mkdir -p data results
          python oos_core_collect.py
          rm -f data/o_*.csv data/macro_*.csv data/news_events.csv
      - name: Run V1.4 baseline
        working-directory: market_data
        run: python event_engine_v14_cloud.py
      - name: Preserve V1.4 baseline summary
        working-directory: market_data
        run: |
          cp results/summary_events_v14.json results/summary_events_v14_holdout.json
          cp results/events_v14.csv results/events_v14_holdout.csv
      - name: Run frozen V1.7 quick-confirm policy
        working-directory: market_data
        run: python event_engine_v17_cloud.py
      - name: Upload holdout results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-holdout-nov-dec-2025-${{ github.run_id }}
          path: |
            market_data/results/completeness.csv
            market_data/results/summary_events_v14_holdout.json
            market_data/results/events_v14_holdout.csv
            market_data/results/summary_events_v17.json
            market_data/results/events_v17.csv
          retention-days: 90
