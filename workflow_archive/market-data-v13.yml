name: market-data-snapshot

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - 'market_data/config.py'
      - 'market_data/collectors.py'
      - 'market_data/validate.py'
      - 'market_data/run_pipeline.py'
      - 'market_data/news_collector.py'
      - 'market_data/requirements.txt'
      - '.github/workflows/market-data-v13.yml'
  workflow_dispatch:

concurrency:
  group: market-data-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: pip install -r market_data/requirements.txt
      - name: Collect and strictly validate market history
        working-directory: market_data
        run: python run_pipeline.py
      - name: Collect timestamped historical news
        working-directory: market_data
        run: python news_collector.py
        continue-on-error: true
      - name: Upload validated snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validated-market-snapshot-20260701-20260831-${{ github.run_id }}
          path: |
            market_data/data/
            market_data/results/completeness.csv
            market_data/results/source_compare.csv
          if-no-files-found: warn
          retention-days: 90
