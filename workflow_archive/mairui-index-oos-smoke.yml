name: mairui-index-oos-smoke

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - '.github/workflows/mairui-index-oos-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe Mairui demo Shanghai index 5m history
        run: |
          pip -q install requests pandas exchange-calendars
          python - <<'PY'
          import requests,pandas as pd
          import exchange_calendars as xcals
          url='https://api.mairuiapi.com/hsindex/history/000001.SH/5/LICENCE-66D8-9F96-0C7F0FBCD073'
          r=requests.get(url,params={'st':'20260501','et':'20260630'},headers={'User-Agent':'Mozilla/5.0'},timeout=20)
          print('status',r.status_code,'bytes',len(r.content),'url',r.url)
          print(r.text[:1500])
          r.raise_for_status()
          try: obj=r.json()
          except Exception as e: raise SystemExit(f'NOT_JSON {e}')
          rows=obj if isinstance(obj,list) else (obj.get('data') or obj.get('Data') or []) if isinstance(obj,dict) else []
          print('rows',len(rows),'type',type(obj).__name__)
          if not rows: raise SystemExit('NO_ROWS')
          print('sample',rows[0],rows[-1])
          # find time-like field dynamically
          k=None
          for cand in ['time','datetime','d','t','date','trademin','trade_time']:
              if cand in rows[0]: k=cand; break
          if k is None: raise SystemExit(f'NO_TIME_FIELD {list(rows[0].keys())}')
          ts=pd.to_datetime([x[k] for x in rows],errors='coerce')
          z=pd.DataFrame({'ts':ts}).dropna(); counts=z.groupby(z.ts.dt.normalize()).size()
          sessions=xcals.get_calendar('XSHG').sessions_in_range(pd.Timestamp('2026-05-01'),pd.Timestamp('2026-06-30'))
          expected=set(pd.DatetimeIndex(sessions).tz_localize(None).normalize()); got=set(z.ts.dt.normalize())
          print('CHECK rows',len(z),'days',len(got),'minmax',counts.min() if len(counts) else None,counts.max() if len(counts) else None,'missing',len(expected-got),'min',z.ts.min(),'max',z.ts.max())
          if len(z)!=1872 or len(got)!=39 or counts.min()!=48 or counts.max()!=48 or got!=expected:
              raise SystemExit('NOT_EXACT_39x48')
          print('MAIRUI_INDEX_EXACT_39x48_OK')
          PY
