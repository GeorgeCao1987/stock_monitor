name: core-oos-compare

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - '.github/workflows/core-oos-compare.yml'
      - 'market_data/oos_core_collect.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  oos-core:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MARKET_START_DATE: '2026-05-01'
      MARKET_END_DATE: '2026-06-30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect exact A-share core OOS data
        working-directory: market_data
        run: |
          rm -rf data results
          mkdir -p data results
          python oos_core_collect.py
      - name: Verify no external inputs are present
        working-directory: market_data
        run: |
          rm -f data/o_*.csv data/macro_*.csv data/news_events.csv
          python - <<'PY'
          from pathlib import Path
          bad=list(Path('data').glob('o_*.csv'))+list(Path('data').glob('macro_*.csv'))
          if Path('data/news_events.csv').exists(): bad.append(Path('data/news_events.csv'))
          if bad: raise SystemExit(f'external inputs remain: {bad}')
          print('CORE_ONLY_INPUTS_OK')
          PY
      - name: Run frozen V1.3 core OOS
        working-directory: market_data
        run: python backtest_v13_cloud.py
      - name: Run frozen V1.4 core OOS
        working-directory: market_data
        run: python backtest_v14_cloud.py
      - name: Run frozen event state machine core OOS
        working-directory: market_data
        run: python event_engine_v14_cloud.py
      - name: Upload core OOS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-oos-may-jun-${{ github.run_id }}
          path: |
            market_data/results/completeness.csv
            market_data/results/summary_v13.json
            market_data/results/candidates_v13.csv
            market_data/results/summary_v14.json
            market_data/results/signals_v14.csv
            market_data/results/summary_events_v14.json
            market_data/results/events_v14.csv
          retention-days: 90

  insample-core:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MARKET_START_DATE: '2026-07-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: pip install -r market_data/requirements.txt
      - name: Restore validated Jul-Aug snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9846959543/zip \
            -o /tmp/snapshot.zip
          mkdir -p market_data
          unzip -q -o /tmp/snapshot.zip -d market_data
      - name: Strip all external inputs and revalidate A-share snapshot
        working-directory: market_data
        run: |
          rm -f data/o_*.csv data/macro_*.csv data/news_events.csv
          rm -f results/summary_v13.json results/candidates_v13.csv results/summary_v14.json results/signals_v14.csv results/summary_events_v14.json results/events_v14.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          from validate import validate_a_share
          symbols=['002916','002463','600183','002938','603228','300476','000001.SH']
          for s in symbols:
              key=s.replace('.','_')
              files=list(Path('data').glob(f'a_{key}_*.csv'))
              if not files: raise SystemExit(f'missing {s}')
              # validated Jul-Aug snapshot's historical primary is mootdx
              p=next((p for p in files if p.name.endswith('_mootdx.csv')),files[0])
              x=pd.read_csv(p)
              _,sm=validate_a_share(x,s)
              r=sm.iloc[0]
              print('IS_CORE_CHECK',s,p.name,r.to_dict())
              if int(r['days'])!=44 or int(r['bars'])!=2112 or float(r['completeness'])!=1.0:
                  raise SystemExit(f'in-sample snapshot invalid {s}')
          print('IS_CORE_DATA_EXACT_OK')
          PY
      - name: Run frozen V1.3 core in-sample
        working-directory: market_data
        run: python backtest_v13_cloud.py
      - name: Run frozen V1.4 core in-sample
        working-directory: market_data
        run: python backtest_v14_cloud.py
      - name: Run frozen event state machine core in-sample
        working-directory: market_data
        run: python event_engine_v14_cloud.py
      - name: Upload core in-sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-insample-jul-aug-${{ github.run_id }}
          path: |
            market_data/results/summary_v13.json
            market_data/results/candidates_v13.csv
            market_data/results/summary_v14.json
            market_data/results/signals_v14.csv
            market_data/results/summary_events_v14.json
            market_data/results/events_v14.csv
          retention-days: 90
