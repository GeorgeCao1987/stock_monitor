name: v15-trend-holdout

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - '.github/workflows/v15-trend-holdout.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  insample-jul-aug:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      MARKET_START_DATE: '2026-07-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: pip install -r market_data/requirements.txt
      - name: Restore validated Jul-Aug core snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9846959543/zip \
            -o /tmp/snapshot.zip
          mkdir -p market_data
          unzip -q -o /tmp/snapshot.zip -d market_data
      - name: Enforce core-only inputs
        working-directory: market_data
        run: |
          rm -f data/o_*.csv data/macro_*.csv data/news_events.csv
          rm -f results/summary_v14.json results/signals_v14.csv results/summary_events_v14.json results/events_v14.csv
          rm -f results/summary_v15.json results/signals_v15.csv results/summary_events_v15.json results/events_v15.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          from validate import validate_a_share
          symbols=['002916','002463','600183','002938','603228','300476','000001.SH']
          for s in symbols:
              key=s.replace('.','_')
              files=list(Path('data').glob(f'a_{key}_*.csv'))
              p=next((p for p in files if p.name.endswith('_mootdx.csv')), files[0] if files else None)
              if p is None: raise SystemExit(f'missing {s}')
              x=pd.read_csv(p); _,sm=validate_a_share(x,s); r=sm.iloc[0]
              print('IS_CHECK',s,r.to_dict())
              if int(r['days'])!=44 or int(r['bars'])!=2112 or float(r['completeness'])!=1.0:
                  raise SystemExit(f'invalid snapshot {s}')
          print('IS_CORE_EXACT_OK')
          PY
      - name: Run V1.4 baseline
        working-directory: market_data
        run: |
          python backtest_v14_cloud.py
          python event_engine_v14_cloud.py
      - name: Run V1.5 trend-gated
        working-directory: market_data
        run: |
          python backtest_v15_cloud.py
          python event_engine_v15_cloud.py
      - name: Upload Jul-Aug comparison
        uses: actions/upload-artifact@v4
        with:
          name: v15-insample-jul-aug-${{ github.run_id }}
          path: |
            market_data/results/summary_v14.json
            market_data/results/signals_v14.csv
            market_data/results/summary_events_v14.json
            market_data/results/events_v14.csv
            market_data/results/summary_v15.json
            market_data/results/signals_v15.csv
            market_data/results/summary_events_v15.json
            market_data/results/events_v15.csv
          retention-days: 90

  validation-may-jun:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      MARKET_START_DATE: '2026-05-01'
      MARKET_END_DATE: '2026-06-30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect and hard-validate core data
        working-directory: market_data
        run: |
          rm -rf data results
          mkdir -p data results
          python oos_core_collect.py
          rm -f data/o_*.csv data/macro_*.csv data/news_events.csv
      - name: Run V1.4 baseline
        working-directory: market_data
        run: |
          python backtest_v14_cloud.py
          python event_engine_v14_cloud.py
      - name: Run V1.5 trend-gated
        working-directory: market_data
        run: |
          python backtest_v15_cloud.py
          python event_engine_v15_cloud.py
      - name: Upload May-Jun validation
        uses: actions/upload-artifact@v4
        with:
          name: v15-validation-may-jun-${{ github.run_id }}
          path: |
            market_data/results/completeness.csv
            market_data/results/summary_v14.json
            market_data/results/summary_events_v14.json
            market_data/results/summary_v15.json
            market_data/results/summary_events_v15.json
            market_data/results/signals_v15.csv
            market_data/results/events_v15.csv
          retention-days: 90

  holdout-mar-apr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MARKET_START_DATE: '2026-03-01'
      MARKET_END_DATE: '2026-04-30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect untouched holdout and hard-validate
        working-directory: market_data
        run: |
          rm -rf data results
          mkdir -p data results
          python oos_core_collect.py
          rm -f data/o_*.csv data/macro_*.csv data/news_events.csv
      - name: Run frozen V1.4 baseline
        working-directory: market_data
        run: |
          python backtest_v14_cloud.py
          python event_engine_v14_cloud.py
      - name: Run frozen V1.5
        working-directory: market_data
        run: |
          python backtest_v15_cloud.py
          python event_engine_v15_cloud.py
      - name: Upload untouched holdout
        uses: actions/upload-artifact@v4
        with:
          name: v15-holdout-mar-apr-${{ github.run_id }}
          path: |
            market_data/results/completeness.csv
            market_data/results/summary_v14.json
            market_data/results/summary_events_v14.json
            market_data/results/summary_v15.json
            market_data/results/summary_events_v15.json
            market_data/results/signals_v15.csv
            market_data/results/events_v15.csv
          retention-days: 90
