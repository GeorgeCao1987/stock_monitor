name: model-replay-v14

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - 'market_data/backtest_v13.py'
      - 'market_data/backtest_v13_cloud.py'
      - 'market_data/backtest_v14.py'
      - 'market_data/backtest_v14_cloud.py'
      - 'market_data/event_engine_v14.py'
      - 'market_data/event_engine_v14_cloud.py'
      - '.github/workflows/model-replay-v14.yml'
  workflow_dispatch:

concurrency:
  group: model-replay-v14-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: pip install -r market_data/requirements.txt
      - name: Restore validated 2026-07-01 to 2026-08-31 snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9846959543/zip \
            -o /tmp/market-data-snapshot.zip
          mkdir -p market_data
          unzip -q -o /tmp/market-data-snapshot.zip -d market_data
      - name: Revalidate snapshot before replay
        working-directory: market_data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from validate import validate_a_share

          symbols = ['002916','002463','600183','002938','603228','300476','000001.SH']
          for symbol in symbols:
              p = Path('data') / f"a_{symbol.replace('.', '_')}_mootdx.csv"
              if not p.exists():
                  raise SystemExit(f'missing validated snapshot file: {p}')
              x = pd.read_csv(p)
              _, summary = validate_a_share(x, symbol)
              r = summary.iloc[0]
              if int(r['days']) != 44 or int(r['bars']) != 2112 or float(r['completeness']) < 0.9999:
                  raise SystemExit(f'snapshot validation failed for {symbol}: {r.to_dict()}')
              print(symbol, int(r['days']), int(r['bars']), float(r['completeness']))
          PY
      - name: Run V1.3 baseline
        working-directory: market_data
        run: python backtest_v13_cloud.py
      - name: Run V1.4 two-tier replay
        working-directory: market_data
        run: python backtest_v14_cloud.py
      - name: Run asymmetric event state machine
        working-directory: market_data
        run: python event_engine_v14_cloud.py
      - name: Upload replay results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-replay-v14-${{ github.run_id }}
          path: |
            market_data/results/summary_v13.json
            market_data/results/candidates_v13.csv
            market_data/results/summary_v14.json
            market_data/results/signals_v14.csv
            market_data/results/summary_events_v14.json
            market_data/results/events_v14.csv
          if-no-files-found: warn
          retention-days: 30
