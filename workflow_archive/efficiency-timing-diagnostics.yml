name: efficiency-timing-diagnostics

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - '.github/workflows/efficiency-timing-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  jan-feb:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MARKET_START_DATE: '2026-01-01'
      MARKET_END_DATE: '2026-02-28'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect exact core and diagnose
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python efficiency_timing_diagnostics_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: eff-time-jan-feb-${{ github.run_id }}
          path: market_data/results/

  mar-apr:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MARKET_START_DATE: '2026-03-01'
      MARKET_END_DATE: '2026-04-30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect exact core and diagnose
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python efficiency_timing_diagnostics_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: eff-time-mar-apr-${{ github.run_id }}
          path: market_data/results/

  may-jun:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      MARKET_START_DATE: '2026-05-01'
      MARKET_END_DATE: '2026-06-30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: |
          pip install -r market_data/requirements.txt
          pip install pytdx
      - name: Collect exact core and diagnose
        working-directory: market_data
        run: |
          rm -rf data results && mkdir -p data results
          python oos_core_collect.py
          python efficiency_timing_diagnostics_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: eff-time-may-jun-${{ github.run_id }}
          path: market_data/results/

  jul-aug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MARKET_START_DATE: '2026-07-01'
      MARKET_END_DATE: '2026-08-31'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - run: pip install -r market_data/requirements.txt
      - name: Restore validated Jul-Aug snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9846959543/zip -o /tmp/s.zip
          unzip -q -o /tmp/s.zip -d market_data
      - name: Strip external and diagnose
        working-directory: market_data
        run: |
          rm -f data/o_*.csv data/macro_*.csv data/news_events.csv
          python efficiency_timing_diagnostics_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: eff-time-jul-aug-${{ github.run_id }}
          path: market_data/results/
