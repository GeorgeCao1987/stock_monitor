name: core-oos-sharded

on:
  push:
    branches: [ market-data-v13 ]
    paths:
      - '.github/workflows/core-oos-sharded.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  MARKET_START_DATE: '2026-05-01'
  MARKET_END_DATE: '2026-06-30'

jobs:
  pcb-stock:
    strategy:
      fail-fast: false
      matrix:
        include:
          - symbol: '002916'
            bs_code: 'sz.002916'
          - symbol: '002463'
            bs_code: 'sz.002463'
          - symbol: '600183'
            bs_code: 'sh.600183'
          - symbol: '002938'
            bs_code: 'sz.002938'
          - symbol: '603228'
            bs_code: 'sh.603228'
          - symbol: '300476'
            bs_code: 'sz.300476'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact Baostock 5m data
        env:
          SYMBOL: ${{ matrix.symbol }}
          BS_CODE: ${{ matrix.bs_code }}
        run: |
          pip -q install baostock pandas exchange-calendars
          mkdir -p /tmp/oos
          python - <<'PY'
          import os,time
          import baostock as bs
          import pandas as pd
          import exchange_calendars as xcals
          symbol=os.environ['SYMBOL']; bs_code=os.environ['BS_CODE']
          start='2026-05-01'; end='2026-06-30'
          last=None; rows=None
          for attempt in range(1,7):
              try:
                  lg=bs.login()
                  if lg.error_code!='0':
                      raise RuntimeError(f'login {lg.error_code}: {lg.error_msg}')
                  try:
                      rs=bs.query_history_k_data_plus(bs_code,'date,time,code,open,high,low,close,volume,amount,adjustflag',start_date=start,end_date=end,frequency='5',adjustflag='3')
                      if rs.error_code!='0': raise RuntimeError(f'query {rs.error_code}: {rs.error_msg}')
                      data=[]
                      while rs.next(): data.append(dict(zip(rs.fields,rs.get_row_data())))
                      if not data: raise RuntimeError('empty rows')
                      rows=data
                      break
                  finally:
                      try: bs.logout()
                      except Exception: pass
              except Exception as e:
                  last=e; print('ATTEMPT_FAIL',symbol,attempt,repr(e)); time.sleep(min(3*attempt,12))
          if rows is None: raise SystemExit(f'{symbol} BAOSTOCK_FAILED {last!r}')
          out=[]
          for p in rows:
              ts=pd.to_datetime((p.get('time') or '')[:14],format='%Y%m%d%H%M%S',errors='coerce')
              if pd.isna(ts): continue
              out.append({'ts':ts,'open':float(p['open']),'high':float(p['high']),'low':float(p['low']),'close':float(p['close']),'volume':float(p['volume'] or 0),'amount':float(p['amount'] or 0),'source':'baostock','symbol':symbol})
          x=pd.DataFrame(out).sort_values('ts').drop_duplicates('ts')
          counts=x.groupby(x.ts.dt.normalize()).size()
          sessions=xcals.get_calendar('XSHG').sessions_in_range(pd.Timestamp(start),pd.Timestamp(end))
          expected=set(pd.DatetimeIndex(sessions).tz_localize(None).normalize()); got=set(x.ts.dt.normalize())
          print('CHECK',symbol,'rows',len(x),'days',len(got),'minmax',counts.min(),counts.max(),'missing',len(expected-got),'min',x.ts.min(),'max',x.ts.max())
          if len(x)!=1872 or len(got)!=39 or counts.min()!=48 or counts.max()!=48 or got!=expected:
              raise SystemExit(f'{symbol} NOT_EXACT_39x48')
          path=f'/tmp/oos/a_{symbol}_baostock.csv'; x.to_csv(path,index=False)
          print('EXACT_OK',symbol,path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: core-oos-data-${{ matrix.symbol }}
          path: /tmp/oos/a_${{ matrix.symbol }}_baostock.csv
          retention-days: 90

  shanghai-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch exact Shanghai Composite 5m data
        run: |
          pip -q install pytdx pandas exchange-calendars
          mkdir -p /tmp/oos
          python - <<'PY'
          from pytdx.hq import TdxHq_API
          import pandas as pd
          import exchange_calendars as xcals
          try:
              from pytdx.config.hosts import hq_hosts
              servers=[(x[1],x[2]) for x in hq_hosts]
          except Exception: servers=[]
          servers += [('180.153.18.170',7709),('119.97.185.59',7709),('124.70.133.119',7709),('116.205.183.150',7709),('123.60.73.44',7709)]
          servers=list(dict.fromkeys(servers)); api=None
          for ip,port in servers:
              a=None
              try:
                  a=TdxHq_API(heartbeat=False,auto_retry=False,raise_exception=True)
                  if not a.connect(ip,port,time_out=2): continue
                  test=a.get_index_bars(0,1,'000001',0,10) or []
                  if len(test)>=5:
                      t=a.to_df(test)
                      if 'datetime' in t.columns and t['datetime'].notna().any():
                          print('INDEX_SERVER_OK',ip,port); api=a; break
              except Exception as e: print('INDEX_SERVER_FAIL',ip,port,repr(e))
              if a is not None:
                  try: a.disconnect()
                  except Exception: pass
          if api is None: raise SystemExit('NO_WORKING_INDEX_SERVER')
          try:
              parts=[]
              for page in range(8):
                  rows=api.get_index_bars(0,1,'000001',page*800,800) or []
                  if not rows: break
                  x=api.to_df(rows); parts.append(x)
                  ts=pd.to_datetime(x['datetime'],errors='coerce')
                  print('PAGE',page,len(x),ts.min(),ts.max())
                  if ts.min()<=pd.Timestamp('2026-05-01'): break
              z=pd.concat(parts,ignore_index=True); z['ts']=pd.to_datetime(z['datetime'],errors='coerce')
              z=z.dropna(subset=['ts']).drop_duplicates('ts').sort_values('ts')
              z=z[(z.ts>=pd.Timestamp('2026-05-01'))&(z.ts<pd.Timestamp('2026-07-01'))]
              out=pd.DataFrame({'ts':z.ts,'open':pd.to_numeric(z.open),'high':pd.to_numeric(z.high),'low':pd.to_numeric(z.low),'close':pd.to_numeric(z.close),'volume':pd.to_numeric(z['vol']) if 'vol' in z else 0,'amount':pd.to_numeric(z['amount']) if 'amount' in z else None,'source':'pytdx_index','symbol':'000001.SH'})
              counts=out.groupby(out.ts.dt.normalize()).size(); sessions=xcals.get_calendar('XSHG').sessions_in_range(pd.Timestamp('2026-05-01'),pd.Timestamp('2026-06-30'))
              expected=set(pd.DatetimeIndex(sessions).tz_localize(None).normalize()); got=set(out.ts.dt.normalize())
              print('CHECK_INDEX','rows',len(out),'days',len(got),'minmax',counts.min(),counts.max(),'missing',len(expected-got))
              if len(out)!=1872 or len(got)!=39 or counts.min()!=48 or counts.max()!=48 or got!=expected: raise SystemExit('INDEX_NOT_EXACT')
              out.to_csv('/tmp/oos/a_000001_SH_pytdx_index.csv',index=False)
              print('INDEX_EXACT_OK')
          finally: api.disconnect()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: core-oos-data-000001-SH
          path: /tmp/oos/a_000001_SH_pytdx_index.csv
          retention-days: 90

  replay:
    needs: [pcb-stock, shanghai-index]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: market_data/requirements.txt
      - name: Install dependencies
        run: pip install -r market_data/requirements.txt
      - name: Download all exact core OOS shards
        uses: actions/download-artifact@v4
        with:
          pattern: core-oos-data-*
          path: market_data/data
          merge-multiple: true
      - name: Build strict completeness manifest
        working-directory: market_data
        run: |
          mkdir -p results
          rm -f data/o_*.csv data/macro_*.csv data/news_events.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          from validate import validate_a_share
          specs={
            '002916':'baostock','002463':'baostock','600183':'baostock','002938':'baostock','603228':'baostock','300476':'baostock','000001.SH':'pytdx_index'
          }
          rows=[]
          for s,src in specs.items():
              p=Path('data')/f"a_{s.replace('.','_')}_{src}.csv"
              if not p.exists(): raise SystemExit(f'MISSING_SHARD {p}')
              x=pd.read_csv(p); _,sm=validate_a_share(x,s); r=sm.iloc[0]
              print('FINAL_CHECK',s,p.name,r.to_dict())
              if int(r['expected_days'])!=39 or int(r['days'])!=39 or int(r['bars'])!=1872 or int(r['missing_days'])!=0 or int(r['incomplete_days'])!=0 or float(r['completeness'])!=1.0:
                  raise SystemExit(f'INVALID_SHARD {s}')
              d=r.to_dict(); d['primary_source']=src; rows.append(d)
          pd.DataFrame(rows).to_csv('results/completeness.csv',index=False)
          print('ALL_7_CORE_OOS_EXACT_OK')
          PY
      - name: Run frozen V1.3 core OOS
        working-directory: market_data
        run: python backtest_v13_cloud.py
      - name: Run frozen V1.4 core OOS
        working-directory: market_data
        run: python backtest_v14_cloud.py
      - name: Run frozen event state machine core OOS
        working-directory: market_data
        run: python event_engine_v14_cloud.py
      - uses: actions/upload-artifact@v4
        with:
          name: core-oos-final-${{ github.run_id }}
          path: |
            market_data/results/completeness.csv
            market_data/results/summary_v13.json
            market_data/results/candidates_v13.csv
            market_data/results/summary_v14.json
            market_data/results/signals_v14.csv
            market_data/results/summary_events_v14.json
            market_data/results/events_v14.csv
          retention-days: 90
